<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
          name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />

        <meta
          name="description"
          content="Эзотерические практики, Таро, астрология, энергетические практики и путь к внутренней гармонии."
        />

        <meta name="author" content="ASTRAE" />
        <meta name="creator" content="ASTRAE" />
        <meta name="publisher" content="ASTRAE" />

        <meta name="application-name" content="ASTRAE" />

        <!-- Цвет интерфейса браузера -->
        <meta name="theme-color" content="#05070d" />

        <!-- Поддержка светлой/тёмной схемы -->
        <meta name="color-scheme" content="dark" />

        <!-- Отключает автоматическое распознавание телефонов/email -->
        <meta name="format-detection" content="telephone=no, email=no, address=no" />

        <!-- Политика передачи referrer -->
        <meta name="referrer" content="strict-origin-when-cross-origin" />


        <!-- =========================
             OPEN GRAPH
             Facebook / Telegram / Discord / LinkedIn и т.д.
        ========================== -->

        <meta property="og:type" content="website" />

        <meta property="og:site_name" content="ASTRAE" />

        <meta
          property="og:title"
          content="ASTRAE — Открой свою истину"
        />

        <meta
          property="og:description"
          content="Эзотерические практики, Таро, астрология и путь к внутренней гармонии."
        />

        <meta
          property="og:image"
          content="https://YOUR-DOMAIN.com/og-image.jpg"
        />

        <meta
          property="og:image:alt"
          content="ASTRAE — эзотерика, гармония и развитие"
        />

        <meta property="og:image:type" content="image/jpeg" />

        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />

        <meta property="og:locale" content="ru_RU" />

        <!-- Если будет украинская версия -->
        <!--
        <meta property="og:locale:alternate" content="uk_UA" />
        -->

        <!-- URL страницы -->
        <meta
          property="og:url"
          content="https://YOUR-DOMAIN.com/"
        />


        <!-- =========================
             X / TWITTER
        ========================== -->

        <meta name="twitter:card" content="summary_large_image" />

        <meta
          name="twitter:title"
          content="ASTRAE — Открой свою истину"
        />

        <meta
          name="twitter:description"
          content="Эзотерические практики, Таро, астрология и путь к внутренней гармонии."
        />

        <meta
          name="twitter:image"
          content="https://YOUR-DOMAIN.com/og-image.jpg"
        />

        <meta
          name="twitter:image:alt"
          content="ASTRAE — эзотерика, гармония и развитие"
        />


        <!-- =========================
             FAVICON
        ========================== -->

        <link
          rel="icon"
          type="image/svg+xml"
          href="/favicon.svg"
        />

        <link
          rel="icon"
          type="image/png"
          sizes="32x32"
          href="/favicon-32x32.png"
        />

        <link
          rel="icon"
          type="image/png"
          sizes="16x16"
          href="/favicon-16x16.png"
        />

        <link
          rel="apple-touch-icon"
          sizes="180x180"
          href="/apple-touch-icon.png"
        />


        <!-- =========================
             PWA
        ========================== -->

        <link rel="manifest" href="/site.webmanifest" />

        <meta
          name="mobile-web-app-capable"
          content="yes"
        />

        <meta
          name="apple-mobile-web-app-capable"
          content="yes"
        />

        <meta
          name="apple-mobile-web-app-title"
          content="ASTRAE"
        />

        <meta
          name="apple-mobile-web-app-status-bar-style"
          content="black-translucent"
        />


        <title>ASTRAE — Открой свою истину</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
